[build-system]
requires = [
    "hatchling>=1.31,<2",
    "hatch-vcs>=0.5,<0.6",
]
build-backend = "hatchling.build"

[project]
name = "mjepa"
description = ""
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Scott Chase Waggener", email = "chase.waggener@icloud.com" },
]
dependencies = [
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
    "einops>=0.8.2,<0.9",
    "ninja>=1.13,<2",
    "pyyaml>=6.0.3,<7",
    "torchmetrics>=1.9,<2",
    "pandas>=3.0.3,<4",
    "pyarrow>=25,<26",
    "safetensors>=0.8,<0.9",
    "tqdm>=4.68.4,<5",
    "vit",
    "wandb>=0.28.1,<0.29",
]
readme = "README.md"
dynamic = [
    "version",
]

[tool.uv.sources]
vit = { git = "https://github.com/TidalPaladin/vit.git", rev = "5884448b157ff13529fc49fb8e86283868540607" }

[project.optional-dependencies]
dicom = [
    "dicom-preprocessing @ git+https://github.com/medcognetics/dicom-preprocessing.git",
]
visualization = [
    "matplotlib>=3.11,<3.12",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9,<1.40",
    "coverage>=7.15.2,<8",
    "pdbpp>=0.12.1,<0.13",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-env>=1.6,<2",
    "pytest-mock>=3.15.1,<4",
    "ruff>=0.15.22,<0.16",
]

[project.license]
text = "Apache"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["_version.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.isort]
lines-after-imports = 2
force-single-line = false
combine-as-imports = true

[tool.basedpyright]
pythonVersion = "3.14"
pythonPlatform = "Linux"
include = ["mjepa", "tests", "trainers"]
exclude = ["**/node_modules", "**/__pycache__", "**/.pytest_cache", "**/_version.py"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
markers = [
    "ci_skip",
    "cuda",
]
filterwarnings = []

[tool.uv]
required-version = ">=0.11.28,<0.12"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "mjepa/_version.py"

[tool.hatch.metadata]
allow-direct-references = true
