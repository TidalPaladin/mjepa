[build-system]
requires = [
    "hatchling==1.33.0",
    "hatch-vcs==0.5.0",
]
build-backend = "hatchling.build"

[project]
name = "mjepa"
description = ""
requires-python = ">=3.11,<3.16"
authors = [
    { name = "Scott Chase Waggener", email = "chase.waggener@icloud.com" },
]
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "einops==0.8.2",
    "ninja==1.13.2",
    "pyyaml==6.0.3",
    "torchmetrics==1.9.0",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "safetensors==0.8.0",
    "tqdm==4.70.1",
    "vit @ git+https://github.com/TidalPaladin/vit.git@ffc2b588c14f0d41dd0d270bd9dc467a6da48d35",
    "wandb==0.31.0",
]
readme = "README.md"
dynamic = [
    "version",
]

[project.optional-dependencies]
dicom = [
    "dicom-preprocessing @ git+https://github.com/medcognetics/dicom-preprocessing.git@a06f33a206bcb8eec740fddce9085d476837d429",
]
visualization = [
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "coverage==7.17.2",
    "pdbpp==0.12.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-env==1.8.5",
    "pytest-mock==3.17.0",
    "ruff==0.17.4",
]

[project.license]
text = "Apache"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["_version.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.isort]
lines-after-imports = 2
force-single-line = false
combine-as-imports = true

[tool.basedpyright]
pythonVersion = "3.15"
pythonPlatform = "Linux"
include = ["mjepa", "tests", "trainers"]
exclude = ["**/node_modules", "**/__pycache__", "**/.pytest_cache", "**/_version.py"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
markers = [
    "ci_skip",
    "cuda",
]
filterwarnings = []

[tool.uv]
required-version = "==0.13.7"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "mjepa/_version.py"

[tool.hatch.metadata]
allow-direct-references = true
